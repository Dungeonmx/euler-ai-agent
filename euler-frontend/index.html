<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/favicon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Euler Chat</title>
  </head>
  <body>
    <div id="root"></div>

    <script>
      // En desarrollo no existe `dist/euler-chat.js`: el server de desarrollo
      // trae el widget transformado desde `/src/main.jsx`. Se le avisa al
      // snippet para que no intente inyectar un archivo inexistente.
      window.__EULER_CHAT_DEV__ = true;
    </script>

    <!--
      El mismo snippet que usa cualquier sitio externo. En desarrollo tambien
      dibuja el boton flotante, asi que `npm run dev` se comporta igual que
      produccion: el boton queda a la derecha y al tocarlo se abre el panel.
      El archivo vive en `public/`, asi que Vite lo sirve desde la raiz.
    -->
    <script src="/iniciar.js" async></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
